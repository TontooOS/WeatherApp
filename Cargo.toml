[package]
name = "weather"
version = "26.1.0"
edition = "2021"
description = "Weather for TontooOS (macOS Weather-style)"
readme = "README.md"

[[bin]]
name = "weather"
path = "src/main.rs"

[dependencies]
# TontooOS SDK: frameworks via features (on-device: /Library/System/sdk).
sdk = { path = "../../TontooLibs/SDK", features = ["TontooUI", "UIKit", "CoreIcon", "WeatherKit", "CoreLocation", "Accessibility", "Foundation"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"
gtk = { package = "gtk4", version = "0.9" }
glib = "0.20"
# CoreData builds on TontooOS / Arch Linux (per its AGENTS.md rule).
coredata = { package = "coredata", path = "../../TontooLibs/CoreData" }
