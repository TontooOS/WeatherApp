[package]
name = "weather"
version = "27.0.0"
edition = "2021"
description = "Weather for TontooOS (macOS Weather-style)"
readme = "README.md"

[[bin]]
name = "weather"
path = "src/main.rs"

[dependencies]
# TontooOS SDK: frameworks via features (on-device: /Library/System/sdk).
sdk = { path = "../../TontooLibs/SDK", features = ["TontooUI", "WeatherKit", "CoreLocation", "Accessibility", "Foundation", "CoreData"] }